<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 仪表盘</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><i class="fas fa-flag"></i> 管理后台</div>
        <nav class="sidebar-nav">
            <a href="index.html"><i class="fas fa-tachometer-alt"></i> 仪表盘</a>
            <a href="users.html"><i class="fas fa-users"></i> 用户管理</a>
            <a href="spots.html"><i class="fas fa-map-marker-alt"></i> 景点管理</a>
            <a href="routes.html"><i class="fas fa-route"></i> 线路管理</a>
            <a href="culture.html"><i class="fas fa-book"></i> 文化管理</a>
            <a href="hotels.html"><i class="fas fa-hotel"></i> 酒店管理</a>
            <a href="foods.html"><i class="fas fa-utensils"></i> 美食管理</a>
            <a href="comments.html"><i class="fas fa-comments"></i> 留言管理</a>
            <a href="orders.html"><i class="fas fa-shopping-cart"></i> 订单管理</a>
            <a href="faqs.html"><i class="fas fa-question-circle"></i> FAQ管理</a>
            <div style="border-top:1px solid rgba(255,255,255,.12);margin:8px 12px"></div>
            <a href="feedbacks.html"><i class="fas fa-bullhorn"></i> 问题反馈</a>
            <a href="route-review.html"><i class="fas fa-clipboard-check"></i> 线路审核</a>
            <a href="spot-review.html"><i class="fas fa-search-plus"></i> 景点审核</a>
            <a href="permissions.html"><i class="fas fa-shield-alt"></i> 权限配置</a>
            <a href="customer-service.html"><i class="fas fa-headset"></i> 人工客服</a>
        </nav>
    </aside>
    <div class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h1>仪表盘</h1>
            <div class="top-bar-right"><span id="adminName"></span> <a href="#" onclick="doLogout()">退出</a></div>
        </header>
        <div class="content">
            <!-- 数据总览：时间范围全局生效，点击分块下钻到对应管理列表 -->
            <div class="card overview-card">
                <div class="card-header">
                    <h2><i class="fas fa-chart-pie"></i> 数据总览</h2>
                    <div class="overview-toolbar">
                        <label class="filter-label"><i class="far fa-clock"></i> 时间范围</label>
                        <select class="form-control" id="overviewRange">
                            <option value="7">近7天</option>
                            <option value="30">近30天</option>
                            <option value="90">近90天</option>
                            <option value="all">全部</option>
                        </select>
                    </div>
                </div>
                <div class="overview-grid" id="overviewGrid">
                    <div class="overview-loading" style="grid-column:1/-1"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>
                </div>
                <p class="overview-tip"><i class="fas fa-info-circle"></i> 分块展示累计总数与所选时间范围内的新增变化，点击分块可携带时间范围下钻到对应管理列表；返回仪表盘或重新打开时将保留上次选择的时间范围。</p>
            </div>

            <h2 class="section-title">平台概览</h2>
            <div class="stat-grid" id="statGrid">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>
            </div>
            <div class="card">
                <div class="card-header"><h2>快捷入口</h2></div>
                <div style="display:flex;flex-wrap:wrap;gap:12px;">
                    <a href="spots.html" class="btn btn-primary"><i class="fas fa-map-marker-alt"></i> 景点管理</a>
                    <a href="routes.html" class="btn btn-info"><i class="fas fa-route"></i> 线路管理</a>
                    <a href="orders.html" class="btn btn-success"><i class="fas fa-shopping-cart"></i> 订单管理</a>
                    <a href="users.html" class="btn btn-warning"><i class="fas fa-users"></i> 用户管理</a>
                    <a href="comments.html" class="btn btn-default"><i class="fas fa-comments"></i> 留言管理</a>
                    <a href="culture.html" class="btn btn-default"><i class="fas fa-book"></i> 文化管理</a>
                    <a href="hotels.html" class="btn btn-default"><i class="fas fa-hotel"></i> 酒店管理</a>
                    <a href="foods.html" class="btn btn-default"><i class="fas fa-utensils"></i> 美食管理</a>
                    <a href="feedbacks.html" class="btn btn-info"><i class="fas fa-bullhorn"></i> 问题反馈</a>
                    <a href="route-review.html" class="btn btn-warning"><i class="fas fa-clipboard-check"></i> 线路审核</a>
                    <a href="spot-review.html" class="btn btn-warning"><i class="fas fa-search-plus"></i> 景点审核</a>
                    <a href="permissions.html" class="btn btn-default"><i class="fas fa-shield-alt"></i> 权限配置</a>
                    <a href="customer-service.html" class="btn btn-info"><i class="fas fa-headset"></i> 人工客服</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/admin-common.js"></script>
<script>
if (!requireAdmin()) throw '';
renderSidebar();

// ---------- 平台概览 ----------
const statConfig = [
    { key: 'userCount', label: '用户总数', icon: 'fas fa-users', color: '#1890ff' },
    { key: 'spotCount', label: '景点总数', icon: 'fas fa-map-marker-alt', color: '#C41A1A' },
    { key: 'routeCount', label: '线路总数', icon: 'fas fa-route', color: '#52c41a' },
    { key: 'cultureCount', label: '文化内容', icon: 'fas fa-book', color: '#722ed1' },
    { key: 'hotelCount', label: '酒店总数', icon: 'fas fa-hotel', color: '#faad14' },
    { key: 'foodCount', label: '美食总数', icon: 'fas fa-utensils', color: '#eb2f96' },
    { key: 'orderCount', label: '订单总数', icon: 'fas fa-shopping-cart', color: '#13c2c2' }
];

(async function() {
    const data = await api('/api/admin/stats/dashboard');
    if (!data) { document.getElementById('statGrid').innerHTML = '<div class="empty-state"><i class="fas fa-chart-bar"></i>暂无数据</div>'; return; }
    let h = '';
    statConfig.forEach(s => {
        h += `<div class="stat-card">
            <div class="stat-icon" style="background:${s.color}"><i class="${s.icon}"></i></div>
            <div class="stat-info"><h3>${data[s.key] ?? 0}</h3><p>${s.label}</p></div>
        </div>`;
    });
    document.getElementById('statGrid').innerHTML = h;
})();

// ---------- 数据总览 ----------
const overviewConfig = [
    { key: 'spot',  label: '景点', page: 'spots.html',  icon: 'fas fa-map-marker-alt', color: '#C41A1A', menuKey: 'spot_manage' },
    { key: 'route', label: '线路', page: 'routes.html', icon: 'fas fa-route',          color: '#52c41a', menuKey: 'route_manage' },
    { key: 'hotel', label: '酒店', page: 'hotels.html', icon: 'fas fa-hotel',          color: '#faad14', menuKey: 'hotel_manage' },
    { key: 'food',  label: '美食', page: 'foods.html',  icon: 'fas fa-utensils',       color: '#eb2f96', menuKey: 'food_manage' }
];

let overviewData = null;
let overviewMenuKeys = null; // null=管理员（全部可见）；Set=工作人员允许的菜单

/* 与侧边栏菜单权限同源：工作人员只展示其有权进入的管理模块 */
(async function initOverviewMenus() {
    const u = getUser();
    if (!u || u.role === 'ADMIN') { overviewMenuKeys = null; return; }
    overviewMenuKeys = new Set(['dashboard', 'spot_manage']);
    const roleMenus = await api('/api/admin/role/menu/list?roleCode=' + encodeURIComponent(u.role));
    if (Array.isArray(roleMenus)) {
        overviewMenuKeys = new Set(
            roleMenus.filter(m => m && Number(m.enabled) === 1 && m.menuKey).map(m => m.menuKey)
        );
        if (!overviewMenuKeys.size) overviewMenuKeys = new Set(['dashboard', 'spot_manage']);
    }
    if (overviewData) renderOverview();
})();

function deltaHtml(delta) {
    if (delta > 0) return `<span class="trend trend-up"><i class="fas fa-arrow-up"></i> ${delta}</span>`;
    if (delta < 0) return `<span class="trend trend-down"><i class="fas fa-arrow-down"></i> ${Math.abs(delta)}</span>`;
    return `<span class="trend trend-flat"><i class="fas fa-minus"></i> 0</span>`;
}

function renderOverview() {
    const grid = document.getElementById('overviewGrid');
    if (!overviewData) {
        grid.innerHTML = '<div class="empty-state"><i class="fas fa-chart-pie"></i>暂无数据</div>';
        return;
    }
    const range = getDashRange();
    const visible = overviewConfig.filter(c => !overviewMenuKeys || overviewMenuKeys.has(c.menuKey));
    if (!visible.length) {
        grid.innerHTML = '<div class="empty-state"><i class="fas fa-lock"></i>暂无可查看的模块，请联系管理员配置菜单权限</div>';
        return;
    }
    grid.style.gridTemplateColumns = `repeat(${Math.min(visible.length, 4)}, 1fr)`;
    grid.innerHTML = visible.map(c => {
        const d = overviewData[c.key] || {};
        const total = d.total ?? 0;
        const isAll = range === 'all';
        const recent = isAll ? total : (d['recent' + range] ?? 0);
        const delta = isAll ? null : (d['delta' + range] ?? 0);
        const recentLabel = isAll ? '全部累计' : dashRangeLabel(range) + '新增';
        const trend = delta === null ? '' :
            `<div class="overview-delta">较上一周期 ${deltaHtml(delta)}</div>`;
        return `<div class="overview-block" onclick="drillToList('${c.key}', '${range}')" title="按${isAll ? '全部时间' : recentLabel}下钻到${c.label}管理列表">
            <div class="overview-head">
                <div class="stat-icon" style="background:${c.color}"><i class="${c.icon}"></i></div>
                <div class="overview-name">${c.label}<span class="overview-total">总数 <b>${total}</b></span></div>
            </div>
            <div class="overview-numbers">
                <div class="overview-recent"><span class="num">${recent}</span><span class="sub">${recentLabel}</span></div>
                ${trend}
            </div>
            <div class="overview-drill"><i class="fas fa-list-ul"></i> 查看明细 <i class="fas fa-chevron-right drill-arrow"></i></div>
        </div>`;
    }).join('');
}

async function loadOverview() {
    document.getElementById('overviewGrid').innerHTML =
        '<div class="overview-loading" style="grid-column:1/-1"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>';
    overviewData = await api('/api/admin/stats/overview');
    renderOverview();
}

const rangeSelect = document.getElementById('overviewRange');
rangeSelect.value = getDashRange();
rangeSelect.addEventListener('change', () => {
    setDashRange(rangeSelect.value);
    renderOverview();
});

loadOverview();
</script>
</body>
</html>
